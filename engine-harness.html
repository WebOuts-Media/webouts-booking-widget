<!doctype html><meta charset="utf-8"><title>engine harness</title>
<!-- Engine mode (WebOuts Scheduling, 2026-10-15), every network call stubbed.
     engine=ok         config says provider:engine; one combined booking
     engine=down       engine never answers: widget must stay on the Calendly path
     engine=ivtaken    first combined booking: interview just taken; second succeeds
     engine=filmtaken  combined booking: filming just taken (back to filming times)
     engine=bookfail   combined booking request fails (network)
     engine=availfail  engine filming availability ok:false
     engine=down&moved=1   moved page, engine never answers: "Booking is busy", no Calendly at all
     engine=availdown      engine mode, then filming availability network-fails: busy screen, no Calendly iframe
     engine=n8nhang        engine says moved while the n8n config never answers: books normally
     engine=bookretry      first combined booking network-fails; the retry must reuse the same idem_key
     Single-appointment links (2026-10-26), added to the URL as the widget reads them:
       book=filming            filming only: slot -> confirm card -> one kind=filming booking, no interview step
       book=filming&p=tok      personal link: info step filled from GET /manage and skipped
       book=interview&p=tok    interview only onto the token's filming: interview slot -> kind=interview booking
       book=interview          no token: problem screen, nothing booked
       book=interview&p=bad    token unknown: problem screen
       book=interview&p=tok&ivexists=1   interview already booked: problem screen with Manage link
     Every engine case must open zero Calendly iframes and never call wo-create-booking.
     Run: chrome --headless=new --virtual-time-budget=30000 --dump-dom http://localhost:PORT/engine-harness.html?engine=ok --><body>
<script>
var Q=new URLSearchParams(location.search);
if(Q.get('moved'))window.WO_MOVED_PAGES=['engine-harness.html'];
window.__idems=[];
window.__log=[];window.__calInit=0;
window.Calendly={initInlineWidget:function(){window.__calInit++;window.__log.push('CALENDLY_IFRAME');}};
function J(o){return Promise.resolve({ok:true,json:function(){return Promise.resolve(o)},text:function(){return Promise.resolve(JSON.stringify(o))}});}
var day=new Date(Date.now()+35*864e5);day.setUTCHours(13,0,0,0);
var f1=day.toISOString(), f2=new Date(day.getTime()+36e5).toISOString();
var iv=new Date(day.getTime()-12*864e5).toISOString();

window.__books=0;
function engineStub(url,body){var e=Q.get('engine');
 if(url.indexOf('/manage?t=')>-1){window.__log.push('ENGINE_MANAGE '+url.split('t=')[1]);
   if(Q.get('p')==='bad')return J({ok:false,error:'bad_token'});
   var ivx=!!Q.get('ivexists');
   return J({ok:true,manage_token:Q.get('p'),page_slug:'x',
     filming:{id:'bk_f',status:'confirmed',start:f1,language:Q.get('lang')==='bi'?'en_es':'en',first_name:'Pre',last_name:'Filled',email:'esmoll@webouts.com',phone:'+14075550142'},
     interview:ivx?{id:'bk_i',status:'confirmed',start:iv}:null,
     can:{reschedule_filming:true,reschedule_interview:ivx,book_interview:!ivx}});}
 if(url.indexOf('/compat/config')>-1){window.__log.push('ENGINE_CONFIG');
   if(e==='down')return new Promise(function(){});           // never answers
   return J({ok:true,provider:'engine',slug:'x',filming:'engine:x:filming',bilingual:'',scripting:'engine:x:interview'});}
 if(url.indexOf('/compat/engine/filming-availability')>-1){window.__log.push('ENGINE_FILMING');
   if(e==='availfail')return J({ok:false,reason:'availability_fetch_failed'});
   if(e==='availdown')return Promise.reject(new Error('net'));
   return J({ok:true,event_type_uri:'engine:x:filming',custom_questions:[],bookedOutMonths:[],slots:[{start_time:f1,scheduling_url:''},{start_time:f2,scheduling_url:''}]});}
 if(url.indexOf('/compat/engine/scripting-availability')>-1){window.__log.push('ENGINE_SCRIPTING');
   return J({ok:true,event_type_uri:'engine:x:interview',custom_questions:[],min_days:7,slots:[{start_time:iv,scheduling_url:''}]});}
 if(url.indexOf('/compat/engine/book')>-1){window.__books++;window.__log.push('ENGINE_BOOK '+((/filming_key=([^&]+)/.exec(body)||[])[1]||(/interview_key=([^&]+)/.exec(body)||[])[1])+' kind='+((/(?:^|&)kind=([a-z]+)/.exec(body)||[])[1]||'both')+' iv='+/interview_start=/.test(body)+' tok='+/manage_token=/.test(body));
   window.__idems.push((/idem_key=([^&]+)/.exec(body)||[])[1]);
   if(e==='bookfail')return Promise.reject(new Error('net'));
   if(e==='bookretry'&&window.__books===1)return Promise.reject(new Error('net'));
   if(e==='ivtaken'&&window.__books===1)return J({ok:false,slot_taken:true,part:'interview'});
   if(e==='filmtaken'&&window.__books===1)return J({ok:false,slot_taken:true,part:'filming'});
   var kind=(/(?:^|&)kind=([a-z]+)/.exec(body)||[])[1]||'both';
   var F={ok:true,event_uri:'engine:booking:bk_f',reschedule_url:'https://webouts.com/x?manage=t',cancel_url:''}, I={ok:true,event_uri:'engine:booking:bk_i',reschedule_url:'https://webouts.com/x?manage=t',cancel_url:''};
   return J({ok:true,filming:F,scripting:kind==='filming'?null:I});}
 return null;}
window.fetch=function(url,opts){url=String(url);var body=(opts&&opts.body)||'';
 var es=engineStub(url,body);if(es)return es;
 if(url.indexOf('wo-create-booking')>-1)window.__log.push('CALENDLY_PROXY_BOOK');
 if(url.indexOf('booking-config')>-1){window.__log.push('N8N_CONFIG');if(Q.get('engine')==='n8nhang')return new Promise(function(){});}
 if(url.indexOf('booking-config')>-1)return J({ok:true,filming:'https://calendly.com/x/f',bilingual:'',scripting:'https://calendly.com/x/s'});
 if(url.indexOf('calendlystatus')>-1)return J({components:[]});
 if(url.indexOf('wo-filming-availability')>-1)return J({ok:true,event_type_uri:'https://api.calendly.com/event_types/F',custom_questions:[],bookedOutMonths:[],slots:[{start_time:f1,scheduling_url:'https://calendly.com/x/f/1'},{start_time:f2,scheduling_url:'https://calendly.com/x/f/2'}]});
 if(url.indexOf('wo-scripting-availability')>-1){window.__log.push('SCRIPTING_AVAIL');
   if(Q.get('ivslots')==='none')return J({ok:true,slots:[],no_slots:true,min_days:7});
   return J({ok:true,event_type_uri:'https://api.calendly.com/event_types/S',custom_questions:[],min_days:7,slots:[{start_time:iv,scheduling_url:'https://calendly.com/x/s/1'}]});}
 if(url.indexOf('wo-create-booking')>-1){var kind=/kind=([a-z]+)/.exec(body)[1];window.__log.push('BOOK_'+kind);
   var lk=Q.get('locked');
   if(lk===kind)return J({ok:false,status:503,slot_taken:false,locked:true,reason:'calendly_unavailable'});
   return J({ok:true,event_uri:'https://api.calendly.com/scheduled_events/'+kind,invitee_uri:'i',cancel_url:'https://calendly.com/c',reschedule_url:'https://calendly.com/r'});}
 return J({ok:false});};
function waitFor(sel,fn,n){n=n||0;var e=document.querySelector(sel);if(e&&e.offsetParent!==null||e&&n>5){fn(e);return;}if(n>200){window.__log.push('TIMEOUT '+sel);finish();return;}setTimeout(function(){waitFor(sel,fn,n+1)},100);}
function vis(id){var e=document.getElementById(id);return !!e&&!e.classList.contains('hidden');}
function finish(){var r=document.createElement('pre');r.id='RESULT';
 r.textContent=JSON.stringify({log:window.__log,calendlyIframes:window.__calInit,lock:vis('wo-locked'),allDone:vis('wo-all-done'),
  earlierInterviewScreen:/needs an earlier interview/.test(document.body.innerText),
  notice:(document.querySelector('.wo-slot-notice')||{}).textContent||'',
  books:window.__books,idems:window.__idems,busy:/Booking is busy/.test(document.body.innerText),retryScreen:/brief hiccup/.test(document.body.innerText),confirmError:(document.querySelector('.wo-confirm-error')||{}).textContent||'',
  confirmNote:(document.querySelector('.wo-confirm-note')||{}).textContent||'',
  pageHeading:(document.getElementById('page-heading')||{}).textContent||'',
  progress:Array.prototype.map.call(document.querySelectorAll('.wo-steps-lbl'),function(e){return e.textContent}),
  confirmTitle:(document.querySelector('.wo-confirm-title')||{}).textContent||'',
  confirmRows:Array.prototype.map.call(document.querySelectorAll('.wo-confirm-row-label'),function(e){return e.textContent}),
  recap:Array.prototype.map.call(document.querySelectorAll('.wo-recap-label'),function(e){return e.textContent}),
  recapNext:(document.querySelector('.wo-recap-next')||{}).textContent||'',
  problem:(document.querySelector('#wo-step-0 .wo-slots-msg h3')||{}).textContent||'',
  manageLink:(document.querySelector('#wo-step-0 .wo-slots-msg a.wo-confirm-btn')||{}).href||'',
  prefill:(function(){var g=function(id){var e=document.getElementById(id);return e?e.value:null};var l2=document.getElementById('l2');return {first:g('wo_first_name'),last:g('wo_last_name'),email:g('wo_email'),phone:g('wo_phone'),cc:g('wo_country'),bi:l2?l2.checked:null}})()});document.body.appendChild(r);}
window.addEventListener('load',function(){setTimeout(function(){
 var mode=Q.get('book')||'both';
 if(!Q.get('p')&&document.getElementById('wo_first_name')){
  document.getElementById('wo_first_name').value='Test';document.getElementById('wo_last_name').value='Provider';
  document.getElementById('wo_email').value='esmoll@webouts.com';document.getElementById('wo_phone').value='4075550142';
  document.getElementById('wo-continue').click();
 }
 if(mode==='interview'){
  if(!Q.get('p')||Q.get('p')==='bad'||Q.get('ivexists')){setTimeout(finish,5000);return;}
  waitFor('#wo-cal-2 .wo-slot-btn',function(b2){b2.click();waitFor('.wo-confirm-btn',function(c){c.click();setTimeout(finish,4000);});});
  return;
 }
 if(mode==='filming'){
  waitFor('#wo-cal-1 .wo-slot-btn',function(b){b.click();waitFor('.wo-confirm-btn',function(c){c.click();setTimeout(finish,4000);});});
  return;
 }
 if(Q.get('engine')==='availfail'||Q.get('engine')==='availdown'||Q.get('moved')){setTimeout(finish,8000);return;}
 waitFor('#wo-cal-1 .wo-slot-btn',function(b){b.click();
  if(Q.get('ivslots')==='none'){setTimeout(finish,4000);return;}
  waitFor('#wo-cal-2 .wo-slot-btn',function(b2){b2.click();
   waitFor('.wo-confirm-btn',function(c){c.click();
     var e=Q.get('engine');
     if(e==='bookretry'){setTimeout(function(){c.click();setTimeout(finish,4000);},1500);return;}
     if(e==='ivtaken'){setTimeout(function(){waitFor('#wo-cal-2 .wo-slot-btn',function(b3){b3.click();waitFor('.wo-confirm-btn',function(c2){c2.click();setTimeout(finish,4000);});});},1500);return;}
     setTimeout(finish,5000);});});});
},3000);});
</script>
<h2 id="page-heading">Book Your Filming and Scripting Interview</h2>
<div id="wo-booking" class="wo-booking">
  <div class="wo-banner">banner</div>
  <div class="wo-stage">
    <div class="wo-step" id="wo-step-0">
      <div class="wo-step-header">Book</div>
      <input type="text" id="wo_first_name"><input type="text" id="wo_last_name">
      <input type="email" id="wo_email">
      <select id="wo_country"><option value="+1">+1</option></select>
      <input type="tel" id="wo_phone">
      <div class="wo-field" id="wo-language-field">
        <div class="wo-language-row">
          <input type="radio" name="wo_language" value="english" id="l1" checked><label class="wo-lang-card" for="l1">EN</label>
          <input type="radio" name="wo_language" value="bilingual" id="l2"><label class="wo-lang-card" for="l2">EN+ES</label>
        </div>
      </div>
      <div class="wo-error" id="wo-error"></div>
      <div class="wo-actions"><button class="wo-btn" id="wo-continue">Continue</button></div>
    </div>
    <div class="wo-step hidden wo-splash" id="wo-step-1-splash"><h3>Step 1</h3></div>
    <div class="wo-step hidden" id="wo-step-1"><div class="wo-cal-container" id="wo-cal-1"></div></div>
    <div class="wo-step hidden wo-splash" id="wo-step-2-splash"><h3>Step 2</h3></div>
    <div class="wo-step hidden" id="wo-step-2"><div class="wo-cal-container" id="wo-cal-2"></div></div>
    <div class="wo-step hidden" id="wo-all-done">done</div>
  </div>
</div>

<script src="./widget.js"></script></body>
